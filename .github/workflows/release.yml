name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # v2.5 -> VERSION_NAME=2.5, VERSION_CODE=20500 (major*10000 + minor*100 + patch),
    # so every new tag installs as an update over the previous one
    - name: Compute version from tag
      run: |
        VERSION_NAME="${GITHUB_REF_NAME#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
        VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
        echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
        echo "Version $VERSION_NAME ($VERSION_CODE)"

    # Always sign with the same release key: Android refuses to update an app
    # whose signature changed (CI debug keys are regenerated on every run)
    - name: Decode signing keystore
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
          echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"
          exit 1
        fi
        echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    - name: Build signed release APK
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Verify signature
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
        "$APKSIGNER" verify --print-certs "$APK"
        cp "$APK" "DrinkOrder-v${VERSION_NAME}.apk"

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          "DrinkOrder-v${VERSION_NAME}.apk" \
          --title "DrinkOrder v${VERSION_NAME}" \
          --notes "## DrinkOrder v${VERSION_NAME}

        Download **DrinkOrder-v${VERSION_NAME}.apk** and open it on your phone to install or update.

        This APK is signed with the DrinkOrder release key, so it installs as an update over any
        previous release signed with the same key, and your drinks are kept.
        (Versions up to v2.4 were signed with a temporary debug key: uninstall those once before
        installing this one.)"
