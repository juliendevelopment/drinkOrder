name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases
  packages: write  # Optional: for package publishing

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease
      
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION_NAME=$(echo $GITHUB_REF | sed 's/refs\/tags\/v//')
        
        # Create the release with both APK files
        gh release create ${{ github.ref_name }} \
          ./app/build/outputs/apk/debug/app-debug.apk#"DrinkOrder v${VERSION_NAME} - Debug APK" \
          ./app/build/outputs/apk/release/app-release-unsigned.apk#"DrinkOrder v${VERSION_NAME} - Release APK (unsigned)" \
          --title "DrinkOrder v${VERSION_NAME}" \
          --notes "## What's New in v${VERSION_NAME}

### 📱 APK Downloads
- **Debug APK**: For testing and development
- **Release APK**: Production build (unsigned)

### Installation
1. Download the appropriate APK file
2. Enable \"Install from Unknown Sources\" in your Android settings
3. Install the APK file

### Changes
_Add your changelog here_"